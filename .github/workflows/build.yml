name: Build and Sign SaveFrenda

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Keystore (if Secrets configured)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Secrets detected. Decoding keystore..."
            echo "$SIGNING_KEY" | base64 -d > release.jks

            # 查找最新的 Android Build-Tools 路径
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
            echo "Using build tools from $BUILD_TOOLS_DIR"

            APK_PATH="app/build/outputs/apk/release/SaveFrenda.apk"
            ALIGNED_APK="app/build/outputs/apk/release/SaveFrenda-aligned.apk"
            SIGNED_APK="app/build/outputs/apk/release/SaveFrenda-Signed.apk"

            echo "Aligning APK..."
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" "$ALIGNED_APK"

            echo "Signing APK with apksigner..."
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEY_STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"

            echo "Verifying signature..."
            $BUILD_TOOLS_DIR/apksigner verify -v "$SIGNED_APK"

            rm -f release.jks
            echo "FINAL_APK=$SIGNED_APK" >> $GITHUB_ENV
            echo "Signed APK successfully created."
          else
            echo "No SIGNING_KEY secret found. Using unsigned release APK."
            echo "FINAL_APK=app/build/outputs/apk/release/SaveFrenda.apk" >> $GITHUB_ENV
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveFrenda
          path: ${{ env.FINAL_APK }}
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK }}
          generate_release_notes: true
